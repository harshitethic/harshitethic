name: Update profile

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate dynamic profile assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          from datetime import date, timedelta
          from pathlib import Path
          from html import unescape

          USER = "harshitethic"
          API = "https://api.github.com"

          def get_json(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "harshitethic-profile-updater",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          user = get_json(f"{API}/users/{USER}")
          repos = get_json(f"{API}/users/{USER}/repos?per_page=100&sort=pushed")
          repos = [r for r in repos if not r.get("fork") and not r.get("archived")]

          latest = repos[:6]
          stars = sum(r.get("stargazers_count", 0) for r in repos)

          # Update latest repo table.
          rows = [
              "| Repository | Description | Stars |",
              "|---|---|---:|",
          ]
          for r in latest:
              name = r["name"].replace("|", "\\|")
              desc = (r.get("description") or "No description").replace("|", "\\|").replace("\n", " ")
              if len(desc) > 100:
                  desc = desc[:97] + "..."
              rows.append(f"| [{name}]({r['html_url']}) | {desc} | {r.get('stargazers_count', 0)} |")

          if not latest:
              rows.append("| No public repositories found | — | 0 |")

          readme = Path("README.md").read_text(encoding="utf-8")
          start, end = "<!-- START_LATEST_REPOS -->", "<!-- END_LATEST_REPOS -->"
          before = readme.split(start, 1)[0]
          after = readme.split(end, 1)[1]
          readme = before + start + "\n" + "\n".join(rows) + "\n" + end + after
          Path("README.md").write_text(readme, encoding="utf-8")

          # Update telemetry SVG.
          tele_path = Path("assets/github-telemetry.svg")
          tele = tele_path.read_text(encoding="utf-8")
          tele = tele.replace(">AUTO</text>", f">{len(repos)}</text>", 1)
          tele = tele.replace(">SYNC</text>", f">{user.get('followers', 0)}</text>", 1)
          tele = tele.replace(">READY</text>", f">{stars}</text>", 1)
          tele_path.write_text(tele, encoding="utf-8")

          # Fetch GitHub's public contribution calendar and rebuild as our own SVG.
          # The calendar contains td elements with data-date and data-level attributes.
          to_day = date.today()
          url = f"https://github.com/users/{USER}/contributions?to={to_day.isoformat()}"
          req = urllib.request.Request(url, headers={"User-Agent": "harshitethic-profile-updater"})
          with urllib.request.urlopen(req, timeout=30) as r:
              html = r.read().decode("utf-8", "replace")

          pairs = re.findall(r'data-date="(\d{4}-\d{2}-\d{2})"[^>]*data-level="(\d+)"', html)
          levels = {d: int(lvl) for d, lvl in pairs}

          # 53 columns x 7 rows.
          dates = sorted(levels)
          if dates:
              dates = dates[-371:]
          x0, y0, size, gap = 60, 132, 12, 5
          rects = []
          for i, d in enumerate(dates):
              dt = date.fromisoformat(d)
              # Monday=0. GitHub's calendar starts on Sunday; map Sunday to row 0.
              row = (dt.weekday() + 1) % 7
              col = (i // 7)
              level = levels.get(d, 0)
              fill = ["#09251E", "#0A4A39", "#07805E", "#00B77D", "#00E6A8"][min(level, 4)]
              x = x0 + col * (size + gap)
              y = y0 + row * (size + gap)
              rects.append(f'<rect x="{x}" y="{y}" width="{size}" height="{size}" rx="3" fill="{fill}"/>')

          activity = Path("assets/github-activity.svg").read_text(encoding="utf-8")
          activity = re.sub(r'<g id="cells">.*?</g>', '<g id="cells">' + ''.join(rects) + '</g>', activity, flags=re.S)
          activity_path = Path("assets/github-activity.svg")
          activity_path.write_text(activity, encoding="utf-8")

          print(f"Updated {len(latest)} repos, {len(repos)} public repos, {user.get('followers', 0)} followers, {stars} stars.")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/github-telemetry.svg assets/github-activity.svg
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update GitHub profile"
            git push
          fi
